<!doctype html>
<html><head><meta charset="utf-8"><title>even tiles</title>
<!-- The fix: the column is a flex box and the card grows to fill it; a lone last item spans the row. -->
<style>
  body { font: 14px/1.4 sans-serif; margin: 0; padding: 24px; background: #f5f5f5 }
  .v-container { max-width: 1200px; margin: 0 auto }
  .v-row { display: flex; flex-wrap: wrap; margin: -12px }
  .v-col { flex: 0 0 20%; max-width: 20%; padding: 12px; box-sizing: border-box; display: flex }
  .v-card { flex-grow: 1 }
  .v-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.2); padding: 16px }
  .v-card-title { font-size: 13px; color: #666 }
  .v-card-text { font-size: 28px; font-weight: 600 }
  @media (max-width: 600px) { .v-col { flex-basis: 50%; max-width: 50% } .v-col:last-child:nth-child(odd) { flex-basis: 100%; max-width: 100% } }
</style></head><body><div class="v-container">
  <h2>Promotion stats</h2>
  <div class="v-row">
    <div class="v-col"><div class="v-card"><div class="v-card-title">Orders</div><div class="v-card-text">412</div></div></div>
    <div class="v-col"><div class="v-card"><div class="v-card-title">Revenue</div><div class="v-card-text">1,204</div></div></div>
    <div class="v-col"><div class="v-card"><div class="v-card-title">Orders with the promotion applied at checkout</div><div class="v-card-text">96</div></div></div>
    <div class="v-col"><div class="v-card"><div class="v-card-title">Discount</div><div class="v-card-text">88</div></div></div>
    <div class="v-col"><div class="v-card"><div class="v-card-title">Customers</div><div class="v-card-text">71</div></div></div>
  </div>
  <h2 style="margin-top:48px">Branches</h2>
  <div class="v-row">
    <div class="v-col"><div class="v-card">Manama</div></div>
    <div class="v-col"><div class="v-card">Riffa</div></div>
    <div class="v-col"><div class="v-card">Muharraq</div></div>
    <div class="v-col"><div class="v-card">Isa Town</div></div>
    <div class="v-col"><div class="v-card">Sitra</div></div>
  </div>
</div></body></html>
