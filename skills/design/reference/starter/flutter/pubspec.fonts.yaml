# Copy the kit's fonts/flutter/ folder to assets/fonts/ (TTFs + OFL texts; no network needed),
# then make the app's ONE `flutter:` section contain the lines below. Merge into the existing
# section: a second `flutter:` key, or dropping `uses-material-design: true`, removes the
# Material icon font and every Icon() renders blank.
flutter:
  uses-material-design: true
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-400.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-500.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-600.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-700.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
