<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time-until lab</title>
<style>
:root{--or:#FF6A1F;--ink:#18130e;--mut:#7a7166;--bg:#F3F0EB;--late:#2E0900}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.3 -apple-system,"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.tn{font-variant-numeric:tabular-nums}
#cap{position:fixed;bottom:0;inset-inline:0;padding:12px 16px;font:700 15px system-ui;background:#000;color:#fff;text-align:center;z-index:9}
.ph{padding:52px 16px 0;font:800 28px/1.1 system-ui}.ps{padding:4px 16px 0;color:var(--mut)}
/* ---------- time device ---------- */
.tcard{margin:20px 16px 0;background:var(--or);color:#fff;border-radius:24px;padding:18px 18px 16px;position:relative}
.trow{display:flex;gap:10px;align-items:center}
.ic{width:30px;height:30px;border-radius:50%;background:rgb(255 255 255/.25);flex:none;display:grid;place-items:center;font-size:15px}
.tt b{display:block;font-size:17px}.tt small{opacity:.8;font-size:13px}
.chip{display:inline-block;margin-top:14px;padding:3px 10px;border-radius:99px;font:700 12px/18px system-ui;background:rgb(255 255 255/.22)}
.chip.starting{background:#fff;color:var(--or)}.chip.late{background:var(--late);color:#fff}.chip.progress{background:#fff;color:var(--ink)}
.line{display:flex;align-items:baseline;gap:8px;margin-top:4px;min-height:62px}
.line .pre,.line .unit{font:600 20px system-ui}
.big{font:800 52px/1.15 system-ui;display:inline-flex;unicode-bidi:isolate}
.slot{display:inline-block;position:relative;overflow:hidden;height:1.15em;vertical-align:top}
.slot .g{display:block;white-space:pre}
.slot .g.n{position:absolute;inset-inline-start:0;top:0}
.bar{position:relative;margin-top:30px;height:24px}
.ticks{display:flex;justify-content:space-between;align-items:flex-end;height:24px}
.ticks i{width:3px;height:14px;border-radius:2px;background:rgb(255 255 255/.32);position:relative;overflow:hidden;flex:none}
.ticks i.ap{height:22px}
.ticks i b{position:absolute;inset:0;background:#fff;opacity:0;transform-origin:bottom}
.ticks i.ap b{background:#fff}.late .ticks i.ap b{background:var(--late)}
.litlayer{position:absolute;inset:0;pointer-events:none}
.litlayer .ticks i{background:#fff}
.mk{position:absolute;top:-4px;left:0;width:2px;height:32px;margin-left:-1px;background:#fff;border-radius:1px;box-shadow:0 0 0 2px var(--or)}
.bl{display:flex;justify-content:space-between;font:600 12px system-ui;opacity:.9;margin-top:6px;position:relative;height:16px}
#lnow{position:absolute;top:-20px;left:0;white-space:nowrap;font:700 12px system-ui}
.btn{margin-top:14px;width:100%;height:44px;border:0;border-radius:14px;background:#fff;color:var(--or);font:700 15px system-ui}
/* ---------- morph ---------- */
#surf{position:absolute;top:118px;inset-inline-start:16px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.06),0 8px 24px rgb(0 0 0/.07);cursor:pointer;view-transition-name:surf;transition:background-color .25s}
.layer{position:absolute;top:0;inset-inline-start:0;opacity:0;pointer-events:none}
.layer.on{opacity:1}
#ghost{position:absolute;top:0;inset-inline-start:0;visibility:hidden;pointer-events:none}
#ghost .layer{opacity:1;position:absolute}
.L .card{background:var(--or);color:#fff;border-radius:16px;position:relative}
.L .icon{width:24px;height:24px;border-radius:50%;background:rgb(255 255 255/.28);display:block}
.L .title{font:600 13px/1.25 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.L .time{font:700 22px/1.15 system-ui}
.L .num{font:800 40px/1.1 system-ui;white-space:nowrap}.L .num .u{font-size:.5em;font-weight:700}.L-pill .num .u,.L-large .num .u{font-size:1em}
.L .row{font:500 13px/18px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);padding:6px 10px;background:#F5F2EE;border-radius:10px}
.L .hdr{font:700 15px/20px system-ui;color:var(--ink)}
.L-small .card{margin:8px;height:88px;padding:10px}
.L-small .time{margin-top:6px}.L-small .title{margin-top:6px}.L-small .title{width:136px}
.L-small .row{margin:4px 8px 0;width:156px;padding:5px 10px}
.L-pill{display:flex;align-items:center;gap:10px;padding:0 8px}
.L-pill .card{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;flex:none}
.L-pill .icon{width:16px;height:16px}
.L-pill .num{font:700 17px/22px system-ui;color:#fff}
.L-wide{display:flex;gap:10px;padding:8px}
.L-wide .card{width:176px;height:156px;padding:12px;flex:none}
.L-wide .title{margin-top:10px;width:152px;font-size:14px}.L-wide .num{margin-top:22px}
.L-wide .rows{display:flex;flex-direction:column;gap:8px;padding-top:12px;min-width:0}.L-wide .row{width:156px}
.L-large{padding:12px 8px 8px}
.L-large .hrow{display:flex;gap:6px;padding:0 8px 10px;align-items:baseline}
.L-large .num{font:700 15px/20px system-ui;color:var(--ink)}
.L-large .card{height:172px;padding:14px}
.L-large .title{font-size:17px;width:300px;margin-top:10px}
.L-large .tline{display:flex;gap:6px;align-items:baseline;margin-top:4px}
.L-large .time{font:700 15px/20px system-ui}.L-large .room{font:500 14px system-ui;opacity:.85}
.L-large .mbar{position:absolute;inset-inline:14px;bottom:14px}
.L-large .row{margin-top:8px}
.mbar .ticks{height:18px}.mbar .ticks i{height:10px}.mbar .ticks i.ap{height:16px}.mbar .ticks i.on{background:#fff}
#surf.pill{background:#111}
.fl{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.below{position:absolute;top:478px;inset-inline:16px}
.below .hd{font:700 17px system-ui;margin-bottom:8px}.below .it{background:#fff;border-radius:14px;height:54px;margin-bottom:8px}
/* view transitions (variant E) */
::view-transition-group(*){animation-duration:.42s;animation-timing-function:linear(0,.13 6%,.44 15%,.75 26%,.94 38%,1.03 50%,1.04 60%,1.01 76%,1)}
::view-transition-old(*),::view-transition-new(*){animation-duration:.2s}
@media (prefers-reduced-motion: reduce){*{transition-duration:0s!important;animation-duration:0s!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style></head>
<body>
<script>
const P = Object.fromEntries(new URLSearchParams(location.search));
const MODE = P.mode || 'time';
const RTL = P.rtl === '1', RM = matchMedia('(prefers-reduced-motion: reduce)').matches, LITE = P.lite === '1';
if (RTL) { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; }
const log = []; window.__log = log; window.__mark = m => log.push({ t: performance.now(), mark: m });
if (P.cap) { const m0 = window.__mark; window.__mark = m => { if (m === 'A') { const q = document.createElement('i'); q.style.cssText = 'position:fixed;right:0;bottom:0;width:10px;height:10px;background:#f00;z-index:99'; document.body.appendChild(q); } m0(m); }; }   // video sync dot
const fmt = n => RTL ? new Intl.NumberFormat('ar-EG').format(n) : String(n);
if (P.cap) { const c = document.createElement('div'); c.id = 'cap'; c.textContent = P.cap; document.body.appendChild(c); }
function ticksHTML(N, apFrom, cls = '') { let s = `<div class="ticks ${cls}">`; for (let i = 0; i < N; i++) s += `<i class="${i >= apFrom ? 'ap' : ''}"><b></b></i>`; return s + '</div>'; }
</script>

<!-- =================== TOPIC 1: time-until device =================== -->
<template id="timeT">
  <div class="ph" id="ph">Good morning</div><div class="ps" id="ps">Tuesday · 3 appointments</div>
  <section class="tcard" id="dev">
    <div class="trow"><span class="ic">✚</span><div class="tt"><b id="ttl">Injured Examinations</b><small id="tsub">11:00–11:45 · Room 2</small></div></div>
    <span class="chip" id="chip">Up next</span>
    <div class="line" id="line"><span class="pre" id="pre"></span><span class="big tn" id="num"></span><span class="unit" id="unit"></span></div>
    <div class="bar" id="bar"><span id="lnow">Now</span><div id="tk"></div><div class="mk" id="mk"></div></div>
    <div class="bl"><span id="l0">Day started 9:00</span><span id="ls">11:45</span></div>
    <button class="btn" id="chk">Check in</button>
  </section>
</template>
<script>
if (MODE === 'time') {
document.body.appendChild(document.getElementById('timeT').content.cloneNode(true));
const NUM = P.num || 'roll';          // roll | rollall | fade | tween | instant
const ENTER = P.enter || 'fade';      // fade (final value, rise) | count (count-up from 0, today's KeyFigure rule)
const BAR = P.bar || 'clip';          // clip (edge reveal) | stagger | scalex | instant
const MARK = P.marker || 'ride';      // ride (marker travels with the fill) | fixed (at its final place at once)
const LIVE = P.live || 'step';        // step (a tick lights when its span has passed) | smooth (current tick fills)
const LABELS = P.labels || 'truth';   // truth | naive
const ISO = P.iso !== '0';
const ROLL = +(P.roll || 200);
const N = +(P.ticks || 33);
const D = 9 * 60, S0 = 11 * 60, E0 = 11 * 60 + 45;           // minutes of day
const pitchMin = (E0 - D) / N, apFrom = Math.round((S0 - D) / pitchMin);
const $ = id => document.getElementById(id);
const numEl = $('num'); if (!ISO) { numEl.style.unicodeBidi = 'normal'; } else numEl.dir = 'ltr';
$('tk').innerHTML = ticksHTML(N, apFrom);
const ticks = [...$('tk').querySelectorAll('i')], lits = ticks.map(t => t.firstChild);
if (RTL) { $('ttl').textContent = 'فحوصات الإصابات'; $('tsub').textContent = '١١:٠٠–١١:٤٥ · غرفة ٢'; $('l0').textContent = 'بدأ اليوم ٩:٠٠'; $('ls').textContent = '١١:٤٥'; $('chk').textContent = 'تسجيل الحضور'; $('ph').textContent = 'صباح الخير'; $('ps').textContent = 'الثلاثاء · ٣ مواعيد'; }

// ---- fake clock (minutes of day, float). rate = clock-minutes per real second
const clk = { base: P.at ? +P.at : 10 * 60 + 18, t0: performance.now(), rate: +(P.rate || 0) };
const now = () => clk.base + (performance.now() - clk.t0) / 1000 * clk.rate;
window.__clock = (m, rate = 0) => { clk.base = m; clk.t0 = performance.now(); clk.rate = rate; };
let checked = false; window.__checkin = v => { checked = v ?? true; };
$('chk').onclick = () => { checked = true; };

// ---- labels
const AR = { in: 'بعد', left: 'متبقٍ', late: 'متأخر', now: 'الآن', chip: { up: 'التالي', starting: 'يبدأ الآن', progress: 'جارٍ الآن', late: 'متأخر', ended: 'انتهى', missed: 'لم يتم الحضور' } };
const arMin = n => { const r = new Intl.PluralRules('ar').select(n); return { one: 'دقيقة', two: 'دقيقتان', few: 'دقائق' }[r] || 'دقيقة'; };
function model(t) {
  const u = S0 - t; let st, n = null;
  if (LABELS === 'naive') {
    if (t < S0) { st = 'up'; n = Math.round(u); }
    else if (checked && t < E0) { st = 'progress'; n = Math.round(E0 - t); }
    else if (t < E0) { st = 'late'; n = Math.round(t - S0); }
    else st = checked ? 'ended' : 'missed';
  } else {
    if (u > 1) { st = 'up'; n = Math.ceil(u); }                       // never "in 0 min": ceil, then a word
    else if (!checked && u > -1) st = 'starting';                     // 1 min either side of the start = "Now"
    else if (checked && t < S0) st = 'starting';
    else if (checked && t < E0) { st = 'progress'; n = Math.ceil(E0 - t); }
    else if (!checked && t < E0) { st = 'late'; n = Math.floor(-u); } // only whole minutes passed: never "late by 0"
    else st = checked ? 'ended' : 'missed';
  }
  return { st, n };
}
function parts(m) {
  const en = !RTL, N_ = m.n == null ? null : fmt(m.n);
  switch (m.st) {
    case 'up': return { pre: en ? 'in' : AR.in, num: N_, unit: en ? 'min' : arMin(m.n) };
    case 'progress': return { pre: '', num: N_, unit: en ? 'min left' : arMin(m.n) + ' ' + AR.left };
    case 'late': return { pre: en ? 'Late by' : AR.late, num: N_, unit: en ? 'min' : arMin(m.n) };
    case 'starting': return { pre: '', num: en ? 'Now' : AR.now, unit: '' };
    case 'ended': return { pre: '', num: en ? 'Ended' : 'انتهى', unit: '' };
    case 'missed': return { pre: '', num: en ? 'Missed' : 'فات', unit: '' };
  }
}
const CHIP = { up: 'Up next', starting: 'Starting now', progress: 'In progress', late: 'Late', ended: 'Done', missed: 'Not checked in' };

// ---- the number: per-slot glyphs, roll only the slots that changed
let cur = '', curVal = null, pend = [], tw = null;
const slotHTML = c => `<span class="slot"><span class="g" data-c="${c}">${c}</span></span>`;
const isNum = s => /^[0-9٠-٩]+$/.test(s);
function finishPending() { for (const f of pend.splice(0)) f(); }
function setNum(str, val, enter) {
  const old = cur; if (str === old) return; cur = str; numEl.dataset.val = str;
  finishPending(); if (tw) { tw = null; }
  const prevVal = curVal; curVal = val;
  if (!old || NUM === 'instant' || RM) { numEl.innerHTML = [...str].map(slotHTML).join(''); return; }
  if (NUM === 'tween' && isNum(old) && isNum(str)) {   // today's "a data change tweens the marks" applied to the number
    tw = { from: prevVal, to: val, t0: performance.now(), dur: 800 }; return;
  }
  const whole = !(isNum(old) && isNum(str)) || NUM === 'rollall';
  const dir = val != null && prevVal != null ? Math.sign(val - prevVal) || 1 : 1; // up = new from below; countdown = new from above
  const L = Math.max(old.length, str.length);
  const o = whole ? [old] : [...old.padStart(L, ' ')], n = whole ? [str] : [...str.padStart(L, ' ')];
  numEl.innerHTML = o.map(slotHTML).join('');
  const slots = [...numEl.children];
  slots.forEach((sl, i) => {
    if (o[i] === n[i]) return;                          // unchanged digit never moves
    const og = sl.firstChild, ng = document.createElement('span');
    ng.className = 'g n'; ng.dataset.c = n[i]; ng.textContent = n[i]; sl.appendChild(ng);
    const w0 = og.getBoundingClientRect().width, w1 = n[i] === ' ' ? 0 : ng.getBoundingClientRect().width;
    if (o[i] === ' ') { og.textContent = ''; }
    const ease = 'cubic-bezier(.2,.8,.2,1)', dur = ROLL;
    const anims = [];
    if (NUM === 'fade') {
      anims.push(og.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur, easing: 'linear', fill: 'forwards' }));
      anims.push(ng.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, easing: 'linear', fill: 'forwards' }));
    } else {
      anims.push(og.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-dir * 100}%)` }], { duration: dur, easing: ease, fill: 'forwards' }));
      anims.push(ng.animate([{ transform: `translateY(${dir * 100}%)` }, { transform: 'translateY(0)' }], { duration: dur, easing: ease, fill: 'forwards' }));
    }
    if (Math.abs(w1 - w0) > .5) anims.push(sl.animate([{ width: w0 + 'px' }, { width: w1 + 'px' }], { duration: dur, easing: ease, fill: 'forwards' }));
    const done = () => { anims.forEach(a => a.cancel()); og.remove(); ng.classList.remove('n'); if (n[i] === ' ') sl.remove(); };
    pend.push(done);
    Promise.all(anims.map(a => a.finished)).then(() => { const k = pend.indexOf(done); if (k >= 0) { pend.splice(k, 1); done(); } }).catch(() => {});
  });
}
function countUp(val, dur) { tw = { from: 0, to: val, t0: performance.now(), dur, ease: t => 1 - Math.pow(1 - t, 3) }; }

// ---- bar
const barEl = $('bar'), mk = $('mk'), lnow = $('lnow');
let entering = null, layer = null, litShown = -1;
function frac(t) { return Math.max(0, Math.min(1, (t - D) / (E0 - D))); }
function barW() { return barEl.clientWidth; }
function xAt(f) { const W = barW(); const p = (W - 3) * f; return RTL ? W - p : p; }   // fill-units → physical px
function applyTicks(t, animateNew) {
  const f = frac(t) * N, full = Math.floor(f), part = f - full;
  const late = !checked && t >= S0 + 1;
  $('dev').classList.toggle('late', late);
  ticks.forEach((tk, i) => {
    const b = lits[i];
    const on = i < full ? 1 : (LIVE === 'smooth' && i === full ? part : 0);
    if (i < full && i >= litShown && litShown >= 0 && full - litShown === 1 && animateNew && !RM) tk.animate([{ transform: 'scaleY(1.45)' }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' }); // lit at once (no lag behind the marker), the pulse says "a minute passed"
    b.style.opacity = on ? 1 : 0; b.style.transform = LIVE === 'smooth' && i === full ? `scaleY(${part})` : '';
  });
  litShown = full;
}
function placeMarker(t) { if (entering && MARK === 'ride') return; const x = xAt(frac(t)); mk.style.transform = `translateX(${x}px)`; placeNow(x, t); }
function placeNow(x, t) {
  const W = barW(), w = lnow.offsetWidth; let l = x - w / 2; l = Math.max(0, Math.min(W - w, l)); lnow.style.left = l + 'px';
  const h = Math.floor(t / 60), m = Math.floor(t % 60);
  lnow.textContent = RTL ? `الآن ${fmt(h)}:${fmt(m).padStart(2, RTL ? '٠' : '0')}` : `Now ${h}:${String(m).padStart(2, '0')}`;
}
window.__enter = () => {          // replay the device's entrance
  window.__mark('enter'); finishPending();
  const t = now(), f = frac(t), lit = Math.floor(f * N);
  const p = parts(model(t)); cur = ''; numEl.innerHTML = '';
  $('pre').textContent = p.pre; $('unit').textContent = p.unit;
  if (ENTER === 'count' && p.num && isNum(p.num) && !RM) { cur = p.num; numEl.dataset.val = p.num; curVal = model(t).n; numEl.innerHTML = [...fmt(0)].map(slotHTML).join(''); countUp(curVal, 1200); }
  else { setNum(p.num, model(t).n); if (!RM) numEl.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.22,.61,.36,1)' }); }
  lits.forEach(b => { b.getAnimations().forEach(a => a.cancel()); b.style.opacity = 0; b.style.transform = ''; });
  layer?.remove(); layer = null; litShown = -1;
  const done = () => { entering = null; layer?.remove(); layer = null; applyTicks(now(), false); placeMarker(now()); window.__mark('entered'); };
  if (BAR === 'instant' || RM) { done(); return; }
  const ease = 'cubic-bezier(.16,1,.3,1)'; // enter-surface stand-in
  let dur;
  entering = { t0: performance.now(), f };
  if (BAR === 'stagger') {
    const step = Math.min(35, 520 / Math.max(1, lit)); dur = lit * step + 220;
    lits.slice(0, lit).forEach((b, i) => { b.style.opacity = 1; b.animate([{ opacity: 0, transform: 'scaleY(.2)' }, { opacity: 1, transform: 'none' }], { duration: 220, delay: i * step, easing: 'ease-out', fill: 'backwards' }); });
    entering.mk = [{ at: 0, f: 0 }, { at: dur - 220, f: lit / N }];
  } else {
    dur = 800;
    layer = document.createElement('div'); layer.className = 'litlayer'; layer.innerHTML = ticksHTML(N, apFrom);
    [...layer.querySelectorAll('i')].forEach((t, i) => { if (i >= lit) t.style.visibility = 'hidden'; });
    barEl.insertBefore(layer, mk);
    const W = barW(), edge = (xAt(lit / N) - (RTL ? 0 : 0));
    if (BAR === 'clip') {
      const rest = Math.max(0, W - f * W);   // reveal ends exactly at "now", not at the bar's end
      const from = RTL ? `inset(0 0 0 ${W}px)` : `inset(0 ${W}px 0 0)`, to = RTL ? `inset(0 0 0 ${rest}px)` : `inset(0 ${rest}px 0 0)`;
      layer.animate([{ clipPath: from }, { clipPath: to }], { duration: dur, easing: ease, fill: 'forwards' });
    } else {
      layer.style.transformOrigin = RTL ? 'right' : 'left';
      layer.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: dur, easing: ease, fill: 'forwards' });
    }
    entering.layerAnim = layer.getAnimations()[0];
  }
  if (MARK === 'ride') {
    const x1 = xAt(f), x0 = xAt(0);
    const a = BAR === 'stagger'
      ? mk.animate([{ transform: `translateX(${x0}px)` }, { transform: `translateX(${x1}px)` }], { duration: dur - 220, delay: 70, easing: 'linear', fill: 'both' })
      : mk.animate([{ transform: `translateX(${x0}px)` }, { transform: `translateX(${x1}px)` }], { duration: dur, easing: ease, fill: 'forwards' });
    mk.style.transform = `translateX(${x1}px)`; placeNow(x1, t);
    lnow.animate([{ opacity: 0 }, { opacity: 0, offset: .7 }, { opacity: 1 }], { duration: dur });
    a.finished.then(() => a.cancel());
  } else placeMarker(t);
  setTimeout(done, dur + 20);
};

// ---- per frame: clock → model → render; then sample what the eye sees
let lastM = '';
function frame() {
  const t = now(), m = model(t), p = parts(m), key = JSON.stringify(p) + checked;
  if (key !== lastM) {
    const first = !lastM; lastM = key;
    $('pre').textContent = p.pre; $('unit').textContent = p.unit;
    $('chip').textContent = RTL ? AR.chip[m.st] : CHIP[m.st]; $('chip').className = 'chip ' + m.st;
    if (!first) { window.__mark('change:' + p.num); setNum(p.num, m.n); }
    $('chk').style.display = checked || m.st === 'ended' || m.st === 'missed' ? 'none' : '';
  }
  if (tw) {
    const k = Math.min(1, (performance.now() - tw.t0) / tw.dur), e = tw.ease ? tw.ease(k) : (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    const v = Math.round(tw.from + (tw.to - tw.from) * e), s = fmt(v);
    if (numEl.textContent !== s) numEl.innerHTML = [...s].map(slotHTML).join('');
    if (k >= 1) tw = null;
  }
