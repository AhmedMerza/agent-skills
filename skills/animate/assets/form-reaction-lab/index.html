<!doctype html>
<!-- Form motion lab: "the UI reacts to what I entered". Every variant is a query param:
     ?m=amount|pick|note  &v=A (skill as written today) | B.. (one axis changed) | W (measured winner, default)
     any axis can be overridden directly, e.g. &v=W&spark=0  &rtl=1  &digits=ar  &kind=pay  &probe=0 (perf runs). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form motion lab</title>
<style>
:root{--ink:#0f1115;--mute:#8a8f98;--line:#e7e8ec;--bg:#f4f5f7;--card:#fff;--acc:#2f6bff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Droid Arabic Kufi",sans-serif;overflow:hidden}
#app{position:absolute;inset:0;transform-origin:50% 0}
.top{height:48px;display:flex;align-items:center;justify-content:center;font-weight:600;position:relative}
.top .x{position:absolute;inset-inline-start:16px;width:30px;height:30px;border-radius:50%;background:#e9eaee;display:grid;place-items:center;font-size:14px}
.bal{margin:4px auto 0;width:max-content;padding:5px 12px;border-radius:99px;background:#fff;font-size:12px;color:var(--mute)}
.bal b{color:var(--ink)}
/* amount */
#amtWrap{position:relative;height:84px;margin-top:10px;overflow:visible}
#amtWrap.clip{overflow:hidden;margin-inline:16px}
#scaler{position:absolute;left:50%;top:0;width:0;height:84px;display:flex;justify-content:center;align-items:center;font-weight:750;font-size:66px;letter-spacing:-.02em;line-height:84px;white-space:nowrap}
#amtWrap.clip #scaler{left:179px}
#scaler.wrap{left:16px;width:358px;flex-wrap:wrap;height:auto;line-height:70px;align-content:flex-start}
#scaler.tab{font-variant-numeric:tabular-nums}
.g{display:inline-block;position:relative}
.g.roll{clip-path:inset(0 -20px)}
.gi{display:inline-block}
.g.ph .gi{color:#c9ccd3}
.g.cur.ph .gi{color:#c9ccd3}
.cap{text-align:center;font-size:12px;color:var(--mute);margin-top:2px}
/* form rows */
.lbl{font-size:11px;letter-spacing:.06em;color:var(--mute);margin:14px 20px 6px}
.row{margin:0 16px;background:var(--card);border-radius:16px;display:flex;align-items:center;padding:12px 14px;gap:10px;position:relative;overflow:hidden}
.row.fixed{min-height:62px}
.cell{flex:1;display:grid;min-width:0}
.layer{grid-area:1/1;display:flex;align-items:center;gap:12px;min-width:0}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:22px;background:#ffe8d6}
.ic.plus{width:28px;height:28px;margin-inline:4px;background:none;border:1.5px solid var(--acc);color:var(--acc);font-size:18px;line-height:1}
.ic.ini{background:#dfe6ff;color:#2a3f8f;font-size:14px;font-weight:700}
.ic.card{border-radius:6px;width:36px;height:24px;margin-block:6px;background:linear-gradient(135deg,#3b82f6,#22d3ee);font-size:0}
.tx{min-width:0;flex:1}
.l1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1.ph{color:var(--acc);font-weight:500}
.l2{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#b9bcc4;font-size:20px;flex:none}
html[dir=rtl] .chev{transform:scaleX(-1)}
.note{margin:0 16px;background:var(--card);border-radius:16px;display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid transparent}
.note:focus-within{border-color:var(--acc)}
#nic{width:30px;height:30px;position:relative;flex:none}
.ico{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;line-height:1}
#noteIn{flex:1;border:0;outline:0;font:inherit;background:none;min-width:0}
/* keypad */
#pad{position:absolute;left:0;right:0;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 24px;direction:ltr}
.k{height:62px;border:0;background:none;font:500 26px system-ui;color:var(--ink);border-radius:20px;position:relative}
.k .hl{position:absolute;inset:4px 18px;border-radius:18px;background:#dfe1e6;opacity:0;pointer-events:none}
/* sheet */
#scrim{position:fixed;inset:0;background:#0b0d12;opacity:0;pointer-events:none}
#sheet{position:fixed;left:0;right:0;bottom:0;height:600px;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px;transform:translateY(102%)}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:#d6d8de;margin:0 auto 10px}
#sheet h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#sheet .close{width:28px;height:28px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;font-size:13px;font-weight:400}
.srch{background:#f1f2f5;border-radius:12px;padding:9px 12px;color:var(--mute);font-size:13px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;position:relative}
.opt .chk{margin-inline-start:auto;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:13px;opacity:0}
.opt.sel{background:#eef3ff}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.spk{position:absolute;width:5px;height:5px;border-radius:50%;margin:-2.5px 0 0 -2.5px}
.ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1.5px solid #8fb0ff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>

  <div class="top"><span class="x">✕</span><span id="ttl">Send</span></div>
  <div class="bal"><span id="balL">Balance</span> <b dir="ltr">$4,820.50</b></div>
  <div id="amtWrap" dir="ltr"><div id="scaler" aria-hidden="true"></div></div>
  <div class="sr" aria-live="polite" id="amtSR"></div>

  <div class="lbl" id="lTo">TO</div>

  <div class="lbl" id="lNote">NOTE</div>

  <div id="pad"></div>
</div>
<div id="scrim"></div>
