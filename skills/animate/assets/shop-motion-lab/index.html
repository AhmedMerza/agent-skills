<!-- Five moments of a phone shopping flow. ?m=entrance|search|item|cart|pay  &v=<preset> (A = what the animate
     skill produces as written, W = measured winner, default)  &rtl=1  &probe=0 (no per-frame probing, for perf runs).

<style>

.field{position:absolute;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mut)}

.field>*:not(.fbg){position:relative}
#hField{top:158px;inset-inline:16px}
.mag{font-size:18px;line-height:1}
#hChips{position:absolute;top:218px;inset-inline-start:16px;display:flex;gap:8px}
.chip{height:30px;padding:0 14px;border-radius:15px;background:rgb(255 255 255/.14);display:flex;align-items:center;font-size:12.5px}
.chip.sel{background:#fff;color:var(--br)}
#hBody{position:absolute;top:262px;inset-inline:0;bottom:0}
#hSec{display:flex;justify-content:space-between;padding:14px 16px 10px;font-weight:700}
#hSec span{color:var(--mut);font-weight:500;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{position:relative;height:200px}
.card .img{height:120px;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.card .img svg{width:120px;height:64px}
.card .txt{padding:8px 4px 0;font-size:12.5px}
.card .txt b{display:block;font-size:10px;color:var(--mut);letter-spacing:.06em}
.card .heart{position:absolute;top:8px;inset-inline-end:10px;color:var(--mut)}
#tabs{position:absolute;bottom:0;inset-inline:0;height:76px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding-top:14px;font-size:20px;color:var(--mut)}
/* search */
#search{background:transparent}
#sBody{position:absolute;inset:104px 0 0 0;background:#fff}

#kb div{display:flex;gap:6px;justify-content:center}
#kb i{width:33px;background:#fff;border-radius:6px;box-shadow:0 1px 0 #999}
/* detail */

#hero{position:absolute;top:120px;inset-inline-start:30px;width:330px;height:176px}

#dR1{display:flex;justify-content:space-between;align-items:flex-end}

#dPrice{font-size:18px}

.lbl{position:relative}
#flyLayer{position:fixed;inset:0;pointer-events:none;z-index:50}

.sr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1eeea;color:#555}
.sr.tot{color:var(--ink);font-weight:700;border:0}
#proc{position:absolute;bottom:120px;inset-inline:0;text-align:center;color:var(--mut);font-size:12px;opacity:0}
#payBtn{bottom:44px;background:none}
#payBg{position:absolute;top:0;bottom:0;left:50%;width:100%;transform:translateX(-50%);border-radius:16px;background:var(--br);transition:background-color .24s}
#payBg.ok{background:var(--ok)}
#payBtn>*:not(#payBg){position:absolute;inset:0;display:grid;place-items:center}
#spin,#chk,#pulse{opacity:0}
#spin i{width:24px;height:24px;border-radius:50%;border:3px solid rgb(255 255 255/.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pulse i{width:56px;height:56px;border-radius:50%;border:2px solid var(--br);opacity:.5}
#chk svg{width:26px;height:26px}
#chk path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
#err{position:absolute;bottom:106px;inset-inline:20px;text-align:center;color:var(--err);font-weight:600;font-size:13px;opacity:0}
#sheet small{position:absolute;bottom:18px;inset-inline:0;text-align:center;color:var(--mut);font-size:11px}
/* success */
#succ{z-index:30;background:#fff}
#wave{position:absolute;inset:0;background:var(--br);clip-path:inset(0 0 284px 0)}
#pill{position:absolute;top:12px;left:50%;margin-left:-70px;width:140px;height:30px;border-radius:15px;background:#111;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;z-index:40;opacity:0}
#bigOk{position:absolute;top:130px;left:50%;margin-left:-44px;width:88px;height:88px;border-radius:50%;background:#fff;color:var(--ok);font-size:44px;font-weight:800;display:grid;place-items:center}

#placed{position:absolute;top:240px;inset-inline:0;text-align:center;color:#fff;font-size:24px}
#placedSub{position:absolute;top:276px;inset-inline:0;text-align:center;color:rgb(255 255 255/.7);font-size:12.5px}

#ocard .tr{position:relative;height:4px;border-radius:2px;background:#eee;margin:22px 6px 8px}
